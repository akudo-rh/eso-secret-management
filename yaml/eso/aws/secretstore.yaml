# AWS Secrets Manager への接続定義 (認証は ROSA の STS)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: <SECRET_STORE>
  namespace: <TARGET_NAMESPACE>
spec:
  provider:
    aws:
      service: SecretsManager
      region: <REGION>                  # 例: ap-northeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: <SERVICE_ACCOUNT>
