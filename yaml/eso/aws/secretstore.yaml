# <リージョン> を置き換えて適用する (例: ap-northeast-1)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-sm
  namespace: eso-test
spec:
  provider:
    aws:
      service: SecretsManager
      region: <リージョン>
      auth:
        jwt:
          serviceAccountRef:
            name: eso-aws-sa
