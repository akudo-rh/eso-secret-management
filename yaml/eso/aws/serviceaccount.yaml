# ESO が AssumeRoleWithWebIdentity に使う SA (ROSA の STS/OIDC を利用。アクセスキー不要)
# <Role ARN> を置き換えて適用する。name / namespace は IAM Role の信頼ポリシーの sub と完全一致させる。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-aws-sa
  namespace: eso-test
  annotations:
    eks.amazonaws.com/role-arn: <Role ARN>   # 例: arn:aws:iam::123456789012:role/rosa-eso-demo
