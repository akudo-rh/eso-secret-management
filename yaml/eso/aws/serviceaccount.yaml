# ESO が AssumeRoleWithWebIdentity に使う SA (ROSA の STS/OIDC を利用。アクセスキー不要)
# <TARGET_NAMESPACE> / <SERVICE_ACCOUNT> は IAM Role の信頼ポリシーの sub と完全一致させる。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: <SERVICE_ACCOUNT>
  namespace: <TARGET_NAMESPACE>
  annotations:
    eks.amazonaws.com/role-arn: <ROLE_ARN>   # 例: arn:aws:iam::123456789012:role/rosa-eso-demo
