# <シークレット名> を置き換えて適用する (例: rosa-demo/password)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-secret-aws
  namespace: eso-test
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: aws-sm
  target:
    name: demo-secret-aws
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: <シークレット名>
