apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-secret-aws
  namespace: eso-test
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: aws-sm
  target:
    name: demo-secret-aws
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: ${AWS_SECRET_NAME}   # 例: rosa-demo/password
