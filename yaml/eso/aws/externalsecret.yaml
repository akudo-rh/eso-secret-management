# AWS Secrets Manager の値を Kubernetes Secret に同期する
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: <TARGET_SECRET>
  namespace: <TARGET_NAMESPACE>
spec:
  refreshInterval: 1m                   # 検証で更新を早く確認するための値。運用は 1h が基本 (README 3.1)
  secretStoreRef:
    kind: SecretStore
    name: <SECRET_STORE>
  target:
    name: <TARGET_SECRET>               # ESO が作成する Kubernetes Secret 名
    creationPolicy: Owner
  data:
    - secretKey: <SECRET_KEY>           # Kubernetes Secret 側のキー (例: password)
      remoteRef:
        key: <REMOTE_SECRET_NAME>       # Secrets Manager 上のシークレット名 (例: rosa-demo/password)
