apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-secret
  namespace: eso-test
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: oci-vault
  target:
    name: demo-secret        # 生成される Kubernetes Secret 名
    creationPolicy: Owner
  data:
    - secretKey: password    # K8s Secret 側のキー
      remoteRef:
        key: eso-demo-password   # OCI Vault 上のシークレット名
