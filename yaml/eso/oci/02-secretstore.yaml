# <> を環境に合わせて置換してから適用する (OCI 検証の記録は docs/eso-oci-vault-verification.md)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: oci-vault
  namespace: eso-test
spec:
  provider:
    oracle:
      region: ap-tokyo-1
      vault: <ocid1.vault.oc1...>
      auth:
        tenancy: <ocid1.tenancy.oc1...>
        user: <ocid1.user.oc1...>
        secretRef:
          privatekey:
            name: oci-credentials
            key: privateKey
          fingerprint:
            name: oci-credentials
            key: fingerprint
