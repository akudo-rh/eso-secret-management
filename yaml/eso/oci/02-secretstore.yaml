# OCI Vault への接続定義 (認証は API キー。手順は docs/eso-oci-vault-verification.md)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: <SECRET_STORE>
  namespace: <TARGET_NAMESPACE>
spec:
  provider:
    oracle:
      region: <REGION>                  # 例: ap-tokyo-1
      vault: <VAULT_OCID>
      auth:
        tenancy: <TENANCY_OCID>
        user: <USER_OCID>
        secretRef:
          privatekey:
            name: <OCI_CREDENTIALS_SECRET>
            key: privateKey
          fingerprint:
            name: <OCI_CREDENTIALS_SECRET>
            key: fingerprint
