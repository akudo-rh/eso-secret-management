# 参考用 (書式の確認のみ)。秘密鍵を Git に置かないため、実際は手順書どおり `oc create secret` で作成する。
apiVersion: v1
kind: Secret
metadata:
  name: <OCI_CREDENTIALS_SECRET>
  namespace: <TARGET_NAMESPACE>
type: Opaque
stringData:
  privateKey: |
    -----BEGIN PRIVATE KEY-----
    ...
    -----END PRIVATE KEY-----
  fingerprint: "aa:bb:cc:..."
