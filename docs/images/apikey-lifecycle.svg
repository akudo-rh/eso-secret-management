<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 110 1200 360" width="900" height="270" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo',sans-serif">
  <defs><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37a3a3"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d10000"/></marker></defs>
  <rect x="0" y="110" width="1200" height="360" fill="#ffffff"/>
  <rect x="40" y="140" width="250" height="90" rx="8" fill="#e7f4f4" stroke="#37a3a3" stroke-width="2"/>
  <text x="165.0" y="179.0" text-anchor="middle" font-size="20" fill="#1f7a7a" font-weight="bold">専用ユーザーで</text>
  <text x="165.0" y="205.0" text-anchor="middle" font-size="17" fill="#555555">API キーを作成</text>
  <circle cx="64" cy="140" r="14" fill="#37a3a3"/>
  <text x="64" y="146" text-anchor="middle" font-size="17" fill="#ffffff" font-weight="bold">1</text>
  <path d="M293,185 L327,185" fill="none" stroke="#37a3a3" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <rect x="330" y="140" width="250" height="90" rx="8" fill="#e7f4f4" stroke="#37a3a3" stroke-width="2"/>
  <text x="455.0" y="179.0" text-anchor="middle" font-size="20" fill="#1f7a7a" font-weight="bold">秘密鍵を</text>
  <text x="455.0" y="205.0" text-anchor="middle" font-size="17" fill="#555555">ダウンロード</text>
  <circle cx="354" cy="140" r="14" fill="#37a3a3"/>
  <text x="354" y="146" text-anchor="middle" font-size="17" fill="#ffffff" font-weight="bold">2</text>
  <path d="M583,185 L617,185" fill="none" stroke="#37a3a3" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <rect x="620" y="140" width="250" height="90" rx="8" fill="#e7f4f4" stroke="#37a3a3" stroke-width="2"/>
  <text x="745.0" y="179.0" text-anchor="middle" font-size="20" fill="#1f7a7a" font-weight="bold">OpenShift に</text>
  <text x="745.0" y="205.0" text-anchor="middle" font-size="17" fill="#555555">Secret として登録</text>
  <circle cx="644" cy="140" r="14" fill="#37a3a3"/>
  <text x="644" y="146" text-anchor="middle" font-size="17" fill="#ffffff" font-weight="bold">3</text>
  <path d="M873,185 L907,185" fill="none" stroke="#37a3a3" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <rect x="910" y="140" width="250" height="90" rx="8" fill="#e7f4f4" stroke="#37a3a3" stroke-width="2"/>
  <text x="1035.0" y="179.0" text-anchor="middle" font-size="20" fill="#1f7a7a" font-weight="bold">作業端末の</text>
  <text x="1035.0" y="205.0" text-anchor="middle" font-size="17" fill="#555555">秘密鍵を削除</text>
  <circle cx="934" cy="140" r="14" fill="#37a3a3"/>
  <text x="934" y="146" text-anchor="middle" font-size="17" fill="#ffffff" font-weight="bold">4</text>
  <text x="165.0" y="262" text-anchor="middle" font-size="17" fill="#555555">権限は読み取りのみ</text>
  <text x="165.0" y="286" text-anchor="middle" font-size="17" fill="#555555">(secret-bundles / vaults)</text>
  <text x="455.0" y="262" text-anchor="middle" font-size="17" fill="#555555">再取得できない</text>
  <text x="455.0" y="286" text-anchor="middle" font-size="17" fill="#555555">紛失したら作り直す</text>
  <text x="745.0" y="262" text-anchor="middle" font-size="17" fill="#555555">プラットフォームチームだけが</text>
  <text x="745.0" y="286" text-anchor="middle" font-size="17" fill="#555555">参照できる Namespace に置く</text>
  <text x="1035.0" y="262" text-anchor="middle" font-size="17" fill="#555555">Secret 以外に</text>
  <text x="1035.0" y="286" text-anchor="middle" font-size="17" fill="#555555">秘密鍵を残さない</text>
  <rect x="40" y="330" width="1120" height="120" rx="16" fill="#f2f2f2"/>
  <text x="60" y="364" text-anchor="start" font-size="17" fill="#1f7a7a" font-weight="bold">ローテーション (止めずに入れ替え)</text>
  <rect x="80" y="388" width="230" height="46" rx="8" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="195.0" y="418.0" text-anchor="middle" font-size="20" fill="#333333">新しいキーを追加</text>
  <path d="M313,411 L357,411" fill="none" stroke="#37a3a3" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <rect x="360" y="388" width="230" height="46" rx="8" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="475.0" y="418.0" text-anchor="middle" font-size="20" fill="#333333">Secret を差し替え</text>
  <path d="M593,411 L637,411" fill="none" stroke="#37a3a3" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <rect x="640" y="388" width="230" height="46" rx="8" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="755.0" y="418.0" text-anchor="middle" font-size="20" fill="#333333">同期を確認</text>
  <path d="M873,411 L917,411" fill="none" stroke="#37a3a3" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <rect x="920" y="388" width="230" height="46" rx="8" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="1035.0" y="418.0" text-anchor="middle" font-size="20" fill="#333333">古いキーを削除</text>
</svg>
