  <text x="140.0" y="145.5" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">1</text>
  <path d="M243,188 L267,188" fill="none" stroke="#37a3a3" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <rect x="270" y="140" width="200" height="96" rx="8" fill="#e7f4f4" stroke="#37a3a3" stroke-width="2"/>
  <text x="370.0" y="183.0" text-anchor="middle" font-size="16" fill="#1f7a7a" font-weight="bold">基盤・IAM の準備</text>
