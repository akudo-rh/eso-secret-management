  <text x="830.0" y="145.5" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">4</text>
  <path d="M933,188 L957,188" fill="none" stroke="#37a3a3" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <rect x="960" y="140" width="200" height="96" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1060.0" y="183.0" text-anchor="middle" font-size="16" fill="#555555">デプロイ・自動同期</text>
