  <text x="1060.0" y="145.5" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">5</text>
  <rect x="40" y="262" width="1120" height="44" rx="16" fill="#ededed"/>
  <text x="600.0" y="290" text-anchor="middle" font-size="17" fill="#333333">値の受け渡しは 6.2 の案から選ぶ。値の更新 (ローテーション) は保管庫に登録するだけで、<tspan fill="#1f7a7a" font-weight="bold">refreshInterval 後に自動で反映</tspan> される。</text>
