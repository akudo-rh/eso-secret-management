  <circle cx="370.0" cy="140" r="13" fill="#37a3a3"/>
  <text x="370.0" y="145.5" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">2</text>
  <path d="M473,188 L497,188" fill="none" stroke="#37a3a3" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <rect x="500" y="140" width="200" height="96" rx="8" fill="#e7f4f4" stroke="#37a3a3" stroke-width="2"/>
  <text x="600.0" y="183.0" text-anchor="middle" font-size="16" fill="#1f7a7a" font-weight="bold">保管庫に値を登録</text>
  <text x="600.0" y="204.6" text-anchor="middle" font-size="13" fill="#555555">開発→テスト→本番 (R3)</text>
  <circle cx="600.0" cy="140" r="13" fill="#37a3a3"/>
  <text x="600.0" y="145.5" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">3</text>
  <path d="M703,188 L727,188" fill="none" stroke="#37a3a3" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <rect x="730" y="140" width="200" height="96" rx="8" fill="#ffffff" stroke="#4d4d4d" stroke-width="2"/>
