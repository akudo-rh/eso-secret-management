  <rect x="763" y="79" width="26" height="18" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="797" y="93" text-anchor="start" font-size="14" fill="#555555">自動で作成</text>
  <rect x="40" y="140" width="200" height="96" rx="8" fill="#ffffff" stroke="#4d4d4d" stroke-width="2"/>
  <text x="140.0" y="183.0" text-anchor="middle" font-size="16" fill="#333333" font-weight="bold">Secret を申請</text>
