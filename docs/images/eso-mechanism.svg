<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo',sans-serif">
  <defs><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37a3a3"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d10000"/></marker></defs>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="600.0" y="52" text-anchor="middle" font-size="26" fill="#d10000">ESO の仕組み：定義を 2 つに分け、Operator が同期する</text>
  <rect x="40" y="270" width="210" height="110" rx="8" fill="#e7f4f4" stroke="#37a3a3" stroke-width="3"/>
  <text x="145.0" y="306.2" text-anchor="middle" font-size="19" fill="#1f7a7a" font-weight="bold">外部の保管庫</text>
  <text x="145.0" y="331.8" text-anchor="middle" font-size="16" fill="#555555">AWS Secrets Manager</text>
  <text x="145.0" y="357.5" text-anchor="middle" font-size="16" fill="#555555">OCI Vault など</text>
  <path d="M290,100 H1160 V508 Q1160,530 1138,530 H312 Q290,530 290,508 Z" fill="#ffffff" stroke="#c8c8c8" stroke-width="2"/>
  <rect x="290" y="100" width="870" height="48" fill="#b3b3b3"/>
  <text x="725.0" y="130.84" text-anchor="middle" font-size="19" fill="#ffffff">OpenShift クラスタ</text>
  <rect x="315" y="170" width="330" height="335" rx="12" fill="#ffffff" stroke="#37a3a3" stroke-width="2"/>
  <path d="M315,182 Q315,170 327,170 H633 Q645,170 645,182 V204 H315 Z" fill="#37a3a3"/>
  <text x="480.0" y="193" text-anchor="middle" font-size="15" fill="#ffffff">プラットフォームチームが管理</text>
  <rect x="345" y="222" width="270" height="68" rx="8" fill="#e7f4f4" stroke="#37a3a3" stroke-width="2"/>
  <text x="480.0" y="250.3" text-anchor="middle" font-size="18" fill="#1f7a7a" font-weight="bold">SecretStore</text>
  <text x="480.0" y="274.6" text-anchor="middle" font-size="15" fill="#555555">接続先と認証方法</text>
  <rect x="345" y="385" width="270" height="80" rx="8" fill="#37a3a3" stroke="#37a3a3" stroke-width="2"/>
  <text x="480.0" y="419.0" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="bold">ESO (Operator)</text>
  <text x="480.0" y="444.7" text-anchor="middle" font-size="16" fill="#ffffff">値を取得して Secret を作る</text>
  <rect x="670" y="170" width="465" height="335" rx="12" fill="#ffffff" stroke="#4d4d4d" stroke-width="2"/>
  <path d="M670,182 Q670,170 682,170 H1123 Q1135,170 1135,182 V204 H670 Z" fill="#4d4d4d"/>
  <text x="902.5" y="193" text-anchor="middle" font-size="15" fill="#ffffff">アプリの Namespace</text>
  <rect x="700" y="215" width="405" height="62" rx="8" fill="#ffffff" stroke="#4d4d4d" stroke-width="2"/>
  <text x="902.5" y="240.3" text-anchor="middle" font-size="18" fill="#333333" font-weight="bold">ExternalSecret</text>
  <text x="902.5" y="264.6" text-anchor="middle" font-size="15" fill="#555555">どの値を、どの Secret 名で取得するか</text>
  <rect x="700" y="320" width="405" height="62" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="902.5" y="345.3" text-anchor="middle" font-size="18" fill="#555555">Secret</text>
  <text x="902.5" y="369.6" text-anchor="middle" font-size="15" fill="#555555">ESO が自動で作成・更新 (手で作らない)</text>
  <rect x="700" y="425" width="405" height="62" rx="8" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="902.5" y="450.3" text-anchor="middle" font-size="18" fill="#333333">アプリ (Pod)</text>
  <text x="902.5" y="474.6" text-anchor="middle" font-size="15" fill="#555555">環境変数 / ボリュームで参照</text>
  <path d="M480,292 L480,382" fill="none" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr-gray)"/>
  <text x="492" y="343.0" text-anchor="start" font-size="14" fill="#555555">参照</text>
  <path d="M698,246 L657,246 L657,398 L619,398" fill="none" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr-gray)"/>
  <path d="M343,440 L145,440 L145,383" fill="none" stroke="#37a3a3" stroke-width="3" marker-end="url(#arr-teal)"/>
  <circle cx="245" cy="440" r="13" fill="#37a3a3"/>
  <text x="245" y="445.5" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">①</text>
  <path d="M617,450 L685,450 L685,351 L698,351" fill="none" stroke="#37a3a3" stroke-width="3" marker-end="url(#arr-teal)"/>
  <circle cx="685" cy="410" r="13" fill="#37a3a3"/>
  <text x="685" y="415.5" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">②</text>
  <path d="M902,384 L902,422" fill="none" stroke="#37a3a3" stroke-width="3" marker-end="url(#arr-teal)"/>
  <circle cx="935" cy="403" r="13" fill="#37a3a3"/>
  <text x="935" y="408.5" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold">③</text>
  <rect x="40" y="555" width="1120" height="90" rx="16" fill="#ededed"/>
  <text x="600.0" y="592" text-anchor="middle" font-size="17" fill="#333333"><tspan fill="#1f7a7a" font-weight="bold">①</tspan> ESO が保管庫から定期的に値を取得 → <tspan fill="#1f7a7a" font-weight="bold">②</tspan> Secret を自動で作成・更新 → <tspan fill="#1f7a7a" font-weight="bold">③</tspan> アプリは従来どおり参照</text>
  <text x="600.0" y="620" text-anchor="middle" font-size="17" fill="#333333">アプリは保管庫の存在を意識しない。Git に置くのは「参照の定義」だけで、値そのものは置かない。</text>
</svg>
