  <rect x="40" y="100" width="400" height="48" fill="#b3b3b3"/>
  <text x="240.0" y="130.84" text-anchor="middle" font-size="19" fill="#ffffff">OpenShift on OCI</text>
  <path d="M640,100 H1160 V398 Q1160,420 1138,420 H662 Q640,420 640,398 Z" fill="#f2f2f2"/>
  <rect x="640" y="100" width="520" height="48" fill="#b3b3b3"/>
  <text x="900.0" y="130.84" text-anchor="middle" font-size="19" fill="#ffffff">OCI</text>
  <rect x="70" y="170" width="340" height="70" rx="8" fill="#37a3a3" stroke="#37a3a3" stroke-width="2"/>
  <text x="240.0" y="199.0" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="bold">ESO</text>
  <text x="240.0" y="224.7" text-anchor="middle" font-size="16" fill="#ffffff">SecretStore の設定で動作</text>
  <rect x="70" y="310" width="340" height="70" rx="8" fill="#ffffff" stroke="#d10000" stroke-width="3"/>
  <text x="240.0" y="339.6" text-anchor="middle" font-size="17" fill="#d10000" font-weight="bold">Secret (API キー)</text>
  <text x="240.0" y="362.6" text-anchor="middle" font-size="14" fill="#555555">秘密鍵とフィンガープリント</text>
  <rect x="670" y="170" width="460" height="70" rx="8" fill="#e7f4f4" stroke="#37a3a3" stroke-width="3"/>
  <text x="900.0" y="199.0" text-anchor="middle" font-size="19" fill="#1f7a7a" font-weight="bold">OCI Vault</text>
  <text x="900.0" y="224.7" text-anchor="middle" font-size="16" fill="#555555">シークレットの保管</text>
  <rect x="670" y="310" width="460" height="70" rx="8" fill="#e7f4f4" stroke="#37a3a3" stroke-width="2"/>
  <text x="900.0" y="339.6" text-anchor="middle" font-size="17" fill="#1f7a7a" font-weight="bold">IAM ポリシー</text>
  <text x="900.0" y="362.6" text-anchor="middle" font-size="14" fill="#555555">API キーのユーザーに読み取りを許可</text>
  <path d="M240,307 L240,243" fill="none" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr-gray)"/>
  <text x="252" y="281.0" text-anchor="start" font-size="14" fill="#555555">参照</text>
  <path d="M412,205 L667,205" fill="none" stroke="#37a3a3" stroke-width="3" marker-end="url(#arr-teal)"/>
  <text x="540" y="192.0" text-anchor="middle" font-size="13" fill="#1f7a7a">API キーで署名して取得</text>
  <path d="M900,308 L900,244" fill="none" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr-gray)"/>
  <text x="912" y="281.0" text-anchor="start" font-size="14" fill="#555555">許可</text>
  <rect x="40" y="448" width="1120" height="90" rx="16" fill="#ededed"/>
  <text x="600.0" y="485" text-anchor="middle" font-size="17" fill="#333333"><tspan fill="#d10000" font-weight="bold">クラスタ内に秘密鍵を持つ</tspan> ため、保管とローテーションの管理が必要 (管理方法の案は 5.2.2)。</text>
  <text x="600.0" y="513" text-anchor="middle" font-size="17" fill="#333333">本番では、ServiceAccount 単位で権限を分けられる Workload Identity を候補とする (5.2.1)。</text>
