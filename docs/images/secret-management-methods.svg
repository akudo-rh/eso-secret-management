<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo',sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37a3a3"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#ffffff"/>

  <!-- タイトル -->
  <text x="600" y="58" text-anchor="middle" font-size="27" fill="#d10000">Secret の値を「どこで」「誰が」管理するか</text>

  <!-- ① 標準 Secret -->
  <path d="M40,105 H560 V420 Q560,465 515,465 H85 Q40,465 40,420 Z" fill="#f2f2f2"/>
  <rect x="40" y="105" width="520" height="52" fill="#b3b3b3"/>
  <text x="300" y="139" text-anchor="middle" font-size="21" fill="#ffffff">① 標準 Secret：クラスタ内で手作業管理</text>

  <rect x="72" y="208" width="120" height="58" rx="8" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="132" y="243" text-anchor="middle" font-size="18" fill="#333333">担当者</text>

  <line x1="196" y1="237" x2="330" y2="237" stroke="#6b6b6b" stroke-width="2" marker-end="url(#arr-gray)"/>
  <text x="263" y="225" text-anchor="middle" font-size="14" fill="#555555" font-family="monospace">oc create secret</text>

  <rect x="338" y="200" width="190" height="74" rx="8" fill="#ffffff" stroke="#d10000" stroke-width="3"/>
  <text x="433" y="232" text-anchor="middle" font-size="19" font-weight="bold" fill="#d10000">Secret</text>
  <text x="433" y="258" text-anchor="middle" font-size="14" fill="#333333">クラスタ (etcd) 内</text>

  <text x="433" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#d10000">↑ base64 エンコードのみ</text>
  <text x="433" y="324" text-anchor="middle" font-size="15" font-weight="bold" fill="#d10000">（暗号化ではない）</text>

  <text x="300" y="380" text-anchor="middle" font-size="16" fill="#333333">値はクラスタ内にだけあり、作成・更新は 1 つずつ手作業。</text>
  <text x="300" y="406" text-anchor="middle" font-size="16" fill="#333333">base64 は<tspan fill="#d10000" font-weight="bold">誰でも元の値に戻せる</tspan>。</text>

  <!-- 中央の矢印 -->
  <path d="M582,262 H620 V238 L660,285 L620,332 V308 H582 Z" fill="#37a3a3"/>

  <!-- ② ESO -->
  <path d="M680,105 H1160 V420 Q1160,465 1115,465 H725 Q680,465 680,420 Z" fill="#ffffff" stroke="#37a3a3" stroke-width="3"/>
  <rect x="680" y="105" width="480" height="52" fill="#37a3a3"/>
  <text x="920" y="139" text-anchor="middle" font-size="21" fill="#ffffff">② ESO：外部の保管庫から自動で同期</text>

  <rect x="704" y="192" width="180" height="98" rx="8" fill="#e7f4f4" stroke="#37a3a3" stroke-width="3"/>
  <text x="794" y="226" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f7a7a">外部の保管庫</text>
  <text x="794" y="252" text-anchor="middle" font-size="13" fill="#333333">AWS Secrets Manager</text>
  <text x="794" y="272" text-anchor="middle" font-size="13" fill="#333333">OCI Vault など</text>

  <line x1="890" y1="241" x2="988" y2="241" stroke="#37a3a3" stroke-width="2.5" marker-end="url(#arr-teal)"/>
  <text x="939" y="222" text-anchor="middle" font-size="14" fill="#1f7a7a">ESO が</text>
  <text x="939" y="268" text-anchor="middle" font-size="14" fill="#1f7a7a">定期的に同期</text>

  <rect x="996" y="208" width="140" height="66" rx="8" fill="#f2f2f2" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="1066" y="237" text-anchor="middle" font-size="18" fill="#333333">Secret</text>
  <text x="1066" y="261" text-anchor="middle" font-size="13" fill="#555555">自動で作成・更新</text>

  <text x="794" y="315" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f7a7a">↑ 値の正はここ 1 か所</text>

  <text x="920" y="380" text-anchor="middle" font-size="16" fill="#333333">値の更新・権限・監査を<tspan fill="#1f7a7a" font-weight="bold">保管庫側で一元管理</tspan>。</text>
  <text x="920" y="406" text-anchor="middle" font-size="16" fill="#333333">アプリは従来どおり Secret を参照するだけ。</text>

  <!-- 下部メッセージ -->
  <rect x="40" y="500" width="1120" height="76" rx="16" fill="#ededed"/>
  <text x="600" y="531" text-anchor="middle" font-size="17" fill="#333333">どちらの方式でも、クラスタ内の Secret 自体は base64 で保存される。</text>
  <text x="600" y="559" text-anchor="middle" font-size="17" fill="#333333"><tspan fill="#1f7a7a" font-weight="bold">etcd の暗号化と RBAC</tspan> は共通の前提とし、ESO で「値の正」と「更新・権限の管理」を保管庫に寄せる。</text>
</svg>
