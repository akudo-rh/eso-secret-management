  <text x="910.0" y="259.0" text-anchor="middle" font-size="20" fill="#1f7a7a" font-weight="bold">記録・統制できる</text>
  <text x="910.0" y="285.0" text-anchor="middle" font-size="17" fill="#555555">アクセスを保管庫で管理</text>
  <text x="724" y="272" text-anchor="middle" font-size="20" fill="#1f7a7a" font-weight="bold">✓</text>
