  <rect x="80" y="236" width="420" height="58" rx="8" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="290.0" y="259.0" text-anchor="middle" font-size="20" fill="#333333">追えない</text>
  <text x="290.0" y="285.0" text-anchor="middle" font-size="17" fill="#555555">誰が見た・使ったか記録がない</text>
  <text x="104" y="272" text-anchor="middle" font-size="20" fill="#d10000" font-weight="bold">×</text>
  <rect x="80" y="306" width="420" height="58" rx="8" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="290.0" y="329.0" text-anchor="middle" font-size="20" fill="#333333">変えられない</text>
  <text x="290.0" y="355.0" text-anchor="middle" font-size="17" fill="#555555">変更は置き場所すべてに手作業</text>
