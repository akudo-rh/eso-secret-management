<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo',sans-serif">
  <defs><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37a3a3"/></marker><marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker><marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d10000"/></marker></defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600.0" y="52" text-anchor="middle" font-size="26" fill="#d10000">Secret 管理の課題と目指す状態</text>
  <path d="M40,100 H540 V408 Q540,430 518,430 H62 Q40,430 40,408 Z" fill="#f2f2f2"/>
  <rect x="40" y="100" width="500" height="48" fill="#b3b3b3"/>
  <text x="290.0" y="130.84" text-anchor="middle" font-size="19" fill="#ffffff">よくある状態 (課題)</text>
  <rect x="80" y="172" width="420" height="48" rx="8" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="290.0" y="201.8" text-anchor="middle" font-size="16" fill="#333333">ソースコード / Git に平文</text>
  <text x="98" y="202" text-anchor="middle" font-size="18" fill="#d10000" font-weight="bold">×</text>
  <rect x="80" y="234" width="420" height="48" rx="8" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="290.0" y="263.8" text-anchor="middle" font-size="16" fill="#333333">CI の変数・設定ファイルに値が残る</text>
  <text x="98" y="264" text-anchor="middle" font-size="18" fill="#d10000" font-weight="bold">×</text>
  <rect x="80" y="296" width="420" height="48" rx="8" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="290.0" y="325.8" text-anchor="middle" font-size="16" fill="#333333">ローテーションが手作業</text>
  <text x="98" y="326" text-anchor="middle" font-size="18" fill="#d10000" font-weight="bold">×</text>
  <rect x="80" y="358" width="420" height="48" rx="8" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
  <text x="290.0" y="387.8" text-anchor="middle" font-size="16" fill="#333333">誰が使ったか追えない</text>
  <text x="98" y="388" text-anchor="middle" font-size="18" fill="#d10000" font-weight="bold">×</text>
  <path d="M560,242 H598 V218 L638,265 L598,312 V288 H560 Z" fill="#37a3a3"/>
  <path d="M660,100 H1160 V408 Q1160,430 1138,430 H682 Q660,430 660,408 Z" fill="#ffffff" stroke="#37a3a3" stroke-width="3"/>
  <rect x="660" y="100" width="500" height="48" fill="#37a3a3"/>
  <text x="910.0" y="130.84" text-anchor="middle" font-size="19" fill="#ffffff">目指す状態</text>
  <rect x="700" y="172" width="420" height="48" rx="8" fill="#e7f4f4" stroke="#37a3a3" stroke-width="2"/>
  <text x="910.0" y="201.8" text-anchor="middle" font-size="16" fill="#1f7a7a" font-weight="bold">値の正は専用の保管庫に 1 か所</text>
  <text x="718" y="202" text-anchor="middle" font-size="18" fill="#1f7a7a" font-weight="bold">✓</text>
  <rect x="700" y="234" width="420" height="48" rx="8" fill="#e7f4f4" stroke="#37a3a3" stroke-width="2"/>
  <text x="910.0" y="263.8" text-anchor="middle" font-size="16" fill="#1f7a7a" font-weight="bold">アプリには必要な時だけ安全に渡す</text>
  <text x="718" y="264" text-anchor="middle" font-size="18" fill="#1f7a7a" font-weight="bold">✓</text>
  <rect x="700" y="296" width="420" height="48" rx="8" fill="#e7f4f4" stroke="#37a3a3" stroke-width="2"/>
  <text x="910.0" y="325.8" text-anchor="middle" font-size="16" fill="#1f7a7a" font-weight="bold">Git には値を置かない</text>
  <text x="718" y="326" text-anchor="middle" font-size="18" fill="#1f7a7a" font-weight="bold">✓</text>
  <rect x="700" y="358" width="420" height="48" rx="8" fill="#e7f4f4" stroke="#37a3a3" stroke-width="2"/>
  <text x="910.0" y="387.8" text-anchor="middle" font-size="16" fill="#1f7a7a" font-weight="bold">更新・権限を保管庫側で一元管理</text>
  <text x="718" y="388" text-anchor="middle" font-size="18" fill="#1f7a7a" font-weight="bold">✓</text>
  <rect x="40" y="462" width="1120" height="90" rx="16" fill="#ededed"/>
  <text x="600.0" y="499" text-anchor="middle" font-size="17" fill="#333333">Secret = パスワード、API キー、証明書、トークンなど、漏えいすると被害が出る値。</text>
  <text x="600.0" y="527" text-anchor="middle" font-size="17" fill="#333333">値の正を <tspan fill="#1f7a7a" font-weight="bold">保管庫 1 か所</tspan> に集め、アプリには自動で安全に渡す仕組みが必要になる。</text>
</svg>
