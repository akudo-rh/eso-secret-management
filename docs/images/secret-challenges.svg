  <text x="910.0" y="130.5" text-anchor="middle" font-size="21" fill="#ffffff">目指す状態 (ESO)</text>
  <rect x="700" y="166" width="420" height="58" rx="8" fill="#e7f4f4" stroke="#37a3a3" stroke-width="2"/>
  <text x="910.0" y="189.0" text-anchor="middle" font-size="20" fill="#1f7a7a" font-weight="bold">1 か所で管理</text>
